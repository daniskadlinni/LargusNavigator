name: Largus Navigator CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build macOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project LargusNavigator.xcodeproj \
            -scheme LargusNavigator \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  live-route-tests:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Compile route smoke tester from production sources
        run: |
          xcrun swiftc \
            LargusNavigator/Models.swift \
            LargusNavigator/OSMRouteEngine.swift \
            LargusNavigator/OSMFuelService.swift \
            CI/RouteSmokeMain.swift \
            -o route-smoke

      - name: Test all 3 Moscow → Zamiany routes and fuel coverage
        run: |
          set -o pipefail
          ./route-smoke | tee route-smoke.log

      - name: Upload route diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-smoke-log
          path: route-smoke.log
          if-no-files-found: ignore
