name: LargusNavigator

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 42
    MARKETING_VERSION: 1.7.8

targets:
  LargusNavigator:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LargusNavigator
        excludes:
          - Resources
      - path: LargusNavigator/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.denis.largusnavigator
        PRODUCT_NAME: Largus Navigator
        EXECUTABLE_NAME: LargusNavigator
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Largus Navigator
        INFOPLIST_KEY_CFBundleShortVersionString: 1.7.8
        INFOPLIST_KEY_CFBundleVersion: 36
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    scheme:
      testTargets:
        - LargusNavigatorTests

  LargusNavigatorTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LargusNavigatorTests
    dependencies:
      - target: LargusNavigator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.denis.largusnavigator.tests
        GENERATE_INFOPLIST_FILE: true
