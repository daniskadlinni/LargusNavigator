name: LargusNavigator

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 42
    MARKETING_VERSION: 1.8.0

targets:
  LargusNavigator:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LargusNavigator
        excludes:
          - Resources
      - path: LargusNavigator/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.denis.largusnavigator
        PRODUCT_NAME: Largus Navigator
        EXECUTABLE_NAME: LargusNavigator
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Largus Navigator
        INFOPLIST_KEY_CFBundleShortVersionString: 1.8.0
        INFOPLIST_KEY_CFBundleVersion: 43
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        CODE_SIGN_ENTITLEMENTS: LargusNavigator/LargusNavigator.entitlements
    scheme:
      testTargets:
        - LargusNavigatorTests

  LargusNavigatorTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LargusNavigatorTests
    dependencies:
      - target: LargusNavigator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.denis.largusnavigator.tests
        GENERATE_INFOPLIST_FILE: true

  LargusNavigatorMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Mobile
      - path: LargusNavigator/Models.swift
      - path: LargusNavigator/AppStore.swift
      - path: LargusNavigator/OSMRouteEngine.swift
      - path: LargusNavigator/RoutePlanningService.swift
      - path: LargusNavigator/StableFuelService.swift
      - path: LargusNavigator/OSMFuelService.swift
      - path: LargusNavigator/ApplePOIService.swift
      - path: LargusNavigator/WeatherService.swift
      - path: LargusNavigator/KeychainStore.swift
      - path: LargusNavigator/YandexJSRouteEngine.swift
      - path: LargusNavigator/YandexLocalWebServer.swift
      - path: LargusNavigator/FuelStopPlanner.swift
      - path: LargusNavigator/FuelCoverageAnalyzer.swift
      - path: LargusNavigator/RouteSimilarityAnalyzer.swift
      - path: LargusNavigator/POICategoryPicker.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.denis.largusnavigator.mobile
        PRODUCT_NAME: Largus Navigator
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Largus Navigator
        INFOPLIST_KEY_CFBundleShortVersionString: 1.8.0
        INFOPLIST_KEY_CFBundleVersion: 43
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Mobile/LargusNavigatorMobile.entitlements
